<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Game Studio Pro - Modular Engine</title>
    <style>
        :root { 
            --bg: #1e1e1e; --panel: #252526; --border: #333; --text: #ccc; 
            --accent: #007acc; --hover: #2a2d2e; --selected: #04395e; 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Consolas', monospace; }
        body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        header { background: #333; padding: 8px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        .btn-group { display: flex; gap: 6px; }
        button { background: var(--accent); color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; }
        button:hover { filter: brightness(1.2); }
        .btn-play { background: #388e3c; }
        .btn-stop { background: #d32f2f; display: none; }
        .btn-pub { background: #8e44ad; }
        .btn-io { background: #d35400; }
        .btn-import { background: #2980b9; } /* New button style */

        .layout { display: flex; height: calc(100vh - 40px); }
        .panel { width: 280px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        #properties { border-left: 1px solid var(--border); border-right: none; width: 340px; }
        .panel-title { font-size: 10px; font-weight: bold; color: #888; padding: 8px; background: #2d2d2d; border-bottom: 1px solid var(--border); text-transform: uppercase; }
        
        .center-area { flex: 1; display: flex; flex-direction: column; position: relative; background: #111; }
        #viewport-container { flex: 1; display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative; }
        #viewport { width: 800px; height: 600px; background: #000; box-shadow: 0 0 20px rgba(0,0,0,1); position: relative; }
        svg { width: 100%; height: 100%; display: block; }

        .list-container { flex: 1; overflow-y: auto; padding: 5px; }
        .tree-item { cursor: pointer; padding: 4px; border-radius: 3px; font-size: 12px; display: flex; align-items: center; gap: 6px; }
        .tree-item:hover { background: var(--hover); }
        .tree-item.selected { background: var(--selected); color: white; }
        .tree-node { margin-left: 12px; border-left: 1px dashed #444; }
        .prop-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 11px; align-items: center; }
        .prop-row input, .prop-row select { width: 60%; background: #3c3c3c; border: 1px solid #555; color: white; padding: 4px; border-radius: 3px; }

        #console-overlay { position: absolute; bottom: 0; left: 0; right: 0; height: 120px; background: rgba(0,0,0,0.85); color: #0f0; padding: 10px; font-size: 11px; overflow-y: auto; display: none; pointer-events: none; border-top: 1px solid #333; z-index: 100; }
        .log-warn { color: #f39c12; } .log-error { color: #e74c3c; }
        #overlay-ui { position: absolute; top: 10px; left: 10px; z-index: 10; display: flex; gap: 5px; }
        .badge { background: #388e3c; padding: 4px 8px; font-size: 11px; font-weight: bold; border-radius: 4px; display: none; }
        
        #script-editor { height: 250px; background: #1e1e1e; border-top: 2px solid var(--accent); display: none; flex-direction: column; }
        #script-editor textarea { flex: 1; background: transparent; color: #9cdcfe; padding: 10px; font-size: 13px; border: none; outline: none; resize: none; }

        body.export-mode header, body.export-mode .panel, body.export-mode #script-editor { display: none !important; }
        body.export-mode .layout { height: 100vh; width: 100vw; margin: 0; padding: 0; }
        body.export-mode #viewport { width: 100%; height: 100%; box-shadow: none; }
    </style>
</head>
<body>

    <header>
        <div><strong>SVG Studio Modular</strong> <span style="color:#888; font-size:10px;">| Engine v2</span></div>
        <div class="btn-group">
            <button id="btn-add-obj">+ Shape</button>
            <button id="btn-add-rb">+ RigidBody</button>
            <button id="btn-add-cam">+ Camera</button>
            <button id="btn-add-script">+ Script</button>
            <button id="btn-add-filter">+ Filter</button>
            <button id="btn-add-particles">+ Emitter</button>
        </div>
        <div class="btn-group">
            <button class="btn-import" id="btn-import-svg">📥 Import Asset SVG</button>
            <input type="file" id="file-input-import" accept=".svg" style="display:none;" />
            <button class="btn-io" id="btn-save-svg">💾 Save Project</button>
            <button class="btn-io" id="btn-load-svg">📂 Load Project</button>
            <input type="file" id="file-input-svg" accept=".svg" style="display:none;" />
            <button id="btn-debug" style="background:#555;">🐞 Debug: OFF</button>
            <button class="btn-pub" id="btn-publish">🚀 Export HTML</button>
            <button class="btn-play" id="btn-play">▶ PLAY</button>
            <button class="btn-stop" id="btn-stop">■ STOP</button>
        </div>
    </header>

    <div class="layout">
        <div class="panel">
            <div class="panel-title">Explorer</div>
            <div class="list-container" id="tree-root"></div>
        </div>

        <div class="center-area">
            <div id="overlay-ui"><div class="badge" id="play-badge">▶ PLAYING</div></div>
            <div id="viewport-container">
                <div id="viewport">
                    <svg id="game-svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
                        <defs id="engine-defs"></defs>
                        <g id="world-root"></g>
                        <g id="particle-root"></g>
                        <g id="debug-root"></g>
                    </svg>
                </div>
                <div id="console-overlay"></div>
            </div>
            <div id="script-editor">
                <div class="panel-title" style="display:flex; justify-content:space-between;">
                    <span id="script-title">Script</span>
                    <button id="btn-close-script" style="padding:2px 6px;">✕</button>
                </div>
                <textarea id="script-textarea" spellcheck="false"></textarea>
            </div>
        </div>

        <div class="panel" id="properties">
            <div class="panel-title">Properties</div>
            <div class="list-container" id="prop-root">
                <div style="color:#666; text-align:center; margin-top:20px; font-size:11px;">Select an object.</div>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
